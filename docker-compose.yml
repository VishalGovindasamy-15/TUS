services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustus
      POSTGRES_PASSWORD: trustus
      POSTGRES_DB: trustus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustus -d trustus"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://trustus:trustus@db:5432/trustus
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ./server/storage:/code/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://trustus:trustus@db:5432/trustus
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes:
      - ./server/storage:/code/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
